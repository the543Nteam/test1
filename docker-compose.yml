services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  browserless:
    image: browserless/chrome:latest
    container_name: browserless
    restart: unless-stopped
    environment:
      MAX_CONCURRENT_SESSIONS: 10
      CONNECTION_TIMEOUT: -1
      # Optionally restrict access with a token (set BROWSERLESS_TOKEN in .env)
      TOKEN: ${BROWSERLESS_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/pressure"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    restart: unless-stopped
    user: root
    ports:
      - "18800:18789"
      - "18801:18790"
    volumes:
      - openclaw-config:/root/.openclaw
      - openclaw-workspace:/root/.openclaw/workspace
    environment:
      # --- Model Provider ---
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENCLAW_MODEL: anthropic/claude-sonnet-4-6

      # --- Ports ---
      OPENCLAW_GATEWAY_PORT: 18789
      OPENCLAW_BRIDGE_PORT: 18790

      # --- Search (SearXNG) ---
      SEARXNG_URL: http://searxng:8080

      # --- Browser (Browserless) ---
      BROWSERLESS_URL: ws://browserless:3000

      # --- Messaging Channels (uncomment as needed) ---
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN}
      # DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
    depends_on:
      searxng:
        condition: service_started
      browserless:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  openclaw-config:
  openclaw-workspace:
